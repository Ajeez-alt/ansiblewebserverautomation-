[defaults]
# Default inventory path
inventory = inventory/hosts.ini

# Remote user for SSH connections
remote_user = ajeez

# Disable SSH host key checking for lab/demo automation
host_key_checking = False

# Disable retry files creation upon playbook failure
retry_files_enabled = False

# Default stdout callback formatting
stdout_callback = ansible.builtin.default

# Python interpreter auto-discovery
interpreter_python = auto_silent

# Suppress cowsay banners
nocows = 1

# Path for roles lookup
roles_path = roles

# Timeout for SSH connections (in seconds)
timeout = 30

[callback_default]
result_format = yaml

[privilege_escalation]
# Automatically escalate privileges for root tasks
become = True
become_method = sudo
become_user = root
become_ask_pass = False

[ssh_connection]
# Optimize SSH connection speed via pipelining
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
