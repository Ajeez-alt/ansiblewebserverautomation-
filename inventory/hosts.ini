# ==============================================================================
# Ansible Inventory (INI Format): inventory/hosts.ini
# Managed by: ARON YUVARAJ J (Roll No. 23bcs162)
# Demonstrates: Host definitions, Groups, Host Variables, Child Groups & Group Vars
# ==============================================================================

# --- Control Node Group ---
[control]
control-node ansible_connection=local ansible_description="Local Master Automation Orchestrator"

# --- Managed Web Servers Group ---
[webservers]
# managed-node-1: Real remote execution over OpenSSH using ED25519 key authentication
managed-node-1 ansible_host=127.0.0.1 ansible_port=22 ansible_user=ajeez ansible_ssh_private_key_file=~/.ssh/id_ed25519 http_port=80 server_priority=primary

# managed-node-2: High-speed loopback local connection (or secondary target)
managed-node-2 ansible_connection=local http_port=80 server_priority=secondary

# --- Load Balancer Group (for future scaling) ---
[loadbalancers]
lb-node-1 ansible_connection=local lb_port=8000

# --- Parent Group containing all infrastructure components ---
[production:children]
control
webservers
loadbalancers

# --- Global Variables for All Hosts ---
[all:vars]
ansible_python_interpreter=/usr/bin/python3
environment_name=production
organization="Mepco Schlenk Engineering College"
project_name="Ansible Web Infrastructure Automation"
